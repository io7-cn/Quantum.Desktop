name: Verify Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - run: python3 -m unittest discover -s .ci/tests -p "test_*.py"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: dotnet test tests/Quantum.Tests/Quantum.Tests.csproj -c Release -p:QuantumCoreOnly=true
      - run: node --test tests/web-plugin-host.test.mjs
      - run: npm ci
        working-directory: tests/Fixtures/Plugins/Quantum.ExampleWebPlugin
      - run: npm test
        working-directory: tests/Fixtures/Plugins/Quantum.ExampleWebPlugin

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File .ci/tests/Test-DesktopUninstall.ps1
      - run: dotnet workload install maui-windows --skip-manifest-update
      - run: dotnet build src/Quantum/Quantum.csproj -c Debug -f net10.0-windows10.0.19041.0
